# MatOffice - Release (branch main, image :latest)
#   docker compose up -d        ->  http://localhost:4820
# The first account that registers is the administrator. MatIdentity and MatSMTP are switched on by Mattiverse (see README).
name: matoffice

services:
  web:
    image: ghcr.io/real-ttx/matoffice:latest
    restart: unless-stopped
    ports:
      - "4820:4820"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matoffice
      POSTGRES_USER: matoffice
      POSTGRES_PASSWORD: matoffice
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matoffice -d matoffice"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  web-data:
  db-data:
