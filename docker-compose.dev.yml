# MatOffice - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:4820
#   pgAdmin: http://localhost:4821   (no sign-in; database password: matoffice)
name: matoffice-dev

services:
  web:
    image: ghcr.io/real-ttx/matoffice:nightly
    restart: unless-stopped
    ports:
      - "4820:4820"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matoffice
      POSTGRES_USER: matoffice
      POSTGRES_PASSWORD: matoffice
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matoffice -d matoffice"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "4821:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matoffice.example.com
      PGADMIN_DEFAULT_PASSWORD: matoffice
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatOffice", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matoffice", "Username": "matoffice", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
